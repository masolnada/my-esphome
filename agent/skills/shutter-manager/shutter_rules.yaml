# Shutter Automation Rules
#
# This file is managed by Home Agent. Ask it conversationally to edit rules.
# Rules are selected from today's forecast maximum temperature.

thresholds:
  hot_above: 28
  cold_below: 23

# Rooms listed here are excluded from automatic scheduling. Manual control remains available.
disabled:
  - habitacio-suli

hot:
  - name: "Group 1: Living Room & Pool Area"
    entities:
      - persiana-menjador
      - persiana-marc-piscina
    open:
      trigger: solar_zenith
    close:
      trigger: sunset

  - name: "Group 2: Kitchen Sink"
    entities:
      - persiana-cuina-pica
    open:
      trigger: solar_zenith
      offset: -60
    close:
      trigger: sunrise
      offset: 30

  - name: "Group 3: South-Facing Zones (Heat Protection)"
    entities:
      - persiana-cuina-sud
    open:
      trigger: time
      time: '17:00'
    close:
      trigger: time
      time: '10:00'

  - name: "Group 3b: South-Facing Zones (Evening Close)"
    entities:
      - persiana-cuina-sud
    close:
      trigger: sunset
      offset: -30

  - name: "Group 3c: South-Facing (Morning Open)"
    entities:
      - persiana-cuina-sud
    open:
      trigger: sunrise
      offset: 0

  - name: "Group 4: Bathroom & Rabbits Area"
    entities:
      - persiana-bany
    open:
      trigger: sunset
    close:
      trigger: solar_zenith
      offset: 60

mild: []
cold:
  - name: "East-Facing: Kitchen Sink, Living Room & Library Pool Window"
    entities:
      - persiana-cuina-pica
      - persiana-menjador
      - persiana-marc-piscina
    open:
      trigger: sunrise
    close:
      trigger: sunset

  - name: "South-Facing: Kitchen"
    entities:
      - persiana-cuina-sud
    open:
      trigger: sunrise
    close:
      trigger: sunset

  - name: "West-Facing: Bathroom"
    entities:
      - persiana-bany
    open:
      trigger: sunrise
    close:
      trigger: sunset

  - name: "North-Facing: Library & Bedroom"
    entities:
      - persiana-marc-nord
      - persiana-dormitori
    open:
      trigger: sunrise
    close:
      trigger: sunset
